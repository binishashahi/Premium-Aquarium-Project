<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquarium System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
    <h1>AquaWorld</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
</header>

<!-- FAQ + FORM -->
<section class="container">

   <!-- LEFT: FAQ -->
<div class="faq">
    <h2>FAQ</h2>

    <div class="faq-item">
        <div class="faq-question">What services do you provide?</div>
        
    </div>

    <div class="faq-item">
        <div class="faq-question">Do you provide home service?</div>
       
    </div>

    <div class="faq-item">
        <div class="faq-question">How to contact you?</div>
        
    </div>
</div>

<!-- RIGHT: FORM -->
<div class="form-box">
    <h2>Contact Form</h2>
    <form>
        <input type="text" placeholder="Full Name" required>
        <input type="tel" placeholder="Phone Number" required>
        <input type="email" placeholder="Email Address" required>

        <select required>
            <option value="">Select Service</option>
            <option>Aquarium Setup</option>
            <option>Cleaning</option>
            <option>Maintenance</option>
        </select>

        <textarea placeholder="Message" rows="4"></textarea>

        <button type="submit">Submit</button>
    </form>
</div>

</section>

<!-- GOOGLE MAP FULL WIDTH -->
<section class="map">
    <iframe src="https://www.google.com/maps?q=Kathmandu&output=embed"></iframe>
</section>

<!-- FOOTER -->
<footer class="footer">
    <p>© 2026 AquaWorld</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>

<!-- FAQ + Contact Form Section -->
<section class="contact-faq-section">
  <div class="container">
    <!-- Left: FAQ -->
    <div class="faq-container">
      <h2>FAQ</h2>
      <div class="faq-item">
        <button class="faq-question">What services do you provide?</button>
        <div class="faq-answer">Aquarium setup, cleaning and maintenance.</div>
      </div>
      <div class="faq-item">
        <button class="faq-question">Do you provide home service?</button>
        <div class="faq-answer">Yes, we provide home service within Kathmandu Valley.</div>
      </div>
      <div class="faq-item">
        <button class="faq-question">How often should I clean my aquarium?</button>
        <div class="faq-answer">Every 2-4 weeks depending on the size and type of fish.</div>
      </div>
    </div>

    <!-- Right: Contact Form -->
    <div class="form-container">
      <h2>Contact Us</h2>
      <form>
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="tel" name="phone" placeholder="Phone Number" required>
        <input type="email" name="email" placeholder="Email Address" required>
        <select name="services" required>
          <option value="">Select Service</option>
          <option value="setup">Aquarium Setup</option>
          <option value="cleaning">Cleaning & Maintenance</option>
          <option value="consultation">Consultation</option>
        </select>
        <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
        <button type="submit">Submit</button>
      </form>
    </div>
  </div>
</section>

<!-- Google Map Section -->
<section class="map-section">
  <iframe 
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3532.123456!2d85.323!3d27.717!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39eb190d2ab12345%3A0x123456789abcdef!2sKathmandu%2C%20Nepal!5e0!3m2!1sen!2snp!4v1690000000000!5m2!1sen!2snp" 
    width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy">
  </iframe>
</section>

<!-- CSS -->
<style>
  .contact-faq-section {
    padding: 50px 20px;
    display: flex;
    justify-content: center;
  }

  .container {
    display: flex;
    flex-wrap: wrap;
    max-width: 1200px;
    gap: 40px;
    width: 100%;
  }

  /* FAQ */
  .faq-container {
    flex: 1;
    min-width: 300px;
  }

  .faq-item {
    margin-bottom: 15px;
  }

  .faq-question {
    width: 100%;
    background: #1e90ff;
    color: #fff;
    padding: 10px 15px;
    border: none;
    cursor: pointer;
    text-align: left;
    font-size: 16px;
    border-radius: 5px;
  }

  .faq-answer {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    padding: 0 15px;
    background: #f1f1f1;
    border-radius: 0 0 5px 5px;
  }

  .faq-item.active .faq-answer {
    max-height: 200px;
    padding: 10px 15px;
  }

  /* Contact Form */
  .form-container {
    flex: 1;
    min-width: 300px;
  }

  .form-container form {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .form-container input,
  .form-container select,
  .form-container textarea,
  .form-container button {
    padding: 12px;
    font-size: 16px;
    border-radius: 5px;
    border: 1px solid #ccc;
  }

  .form-container button {
    background: #1e90ff;
    color: white;
    border: none;
    cursor: pointer;
  }

  .map-section iframe {
    width: 100%;
    border: none;
  }

  @media (max-width: 768px) {
    .container {
      flex-direction: column;
    }
  }
</style>

<!-- JS for FAQ Toggle -->
<script>
  document.querySelectorAll('.faq-question').forEach(button => {
    button.addEventListener('click', () => {
      const item = button.parentElement;
      item.classList.toggle('active');
    });
  });
</script>
